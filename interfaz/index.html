<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ARCADE · AI ENGINE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>

    <!-- header -->
    <header class="arcadeHeader">
        <div class="marqueeWrap">
            <h1 class="marqueeTitle" data-text="ARCADE · AI ENGINE">ARCADE · AI ENGINE</h1>
            <p class="marqueeSub">INSERT COIN · SELECT YOUR GAME</p>
        </div>
        <div class="creditDisplay">
            <span class="creditLabel">CREDIT</span>
            <span class="creditValue" id="creditCount">01</span>
        </div>
    </header>

    <!--CARRUSEL-->
    <section id="seleccionView" class="seleccionView">
        <div class="carousel">
            <button class="carouselNav prev" id="navPrev" aria-label="anterior">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4 L7 12 L15 20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="square"/></svg>
            </button>

            <div class="carouselViewport">
                <div class="carouselTrack" id="carouselTrack">
                    <!-- ── CABINET FROZEN LAKE ── -->
                    <article class="cabinet" data-game="frozen_lake" data-theme="ice">
                        <div class="cabinetMarquee">
                            <span class="cabinetMarqueeLabel">MÓDULO 01</span>
                            <h2>FROZEN LAKE</h2>
                        </div>
                        <div class="cabinetScreen">
                            <div class="screenGrid" id="previewFrozen"></div>
                            <div class="screenScanlines"></div>
                            <div class="screenVignette"></div>
                        </div>
                        <div class="cabinetControls">
                            <div class="cabinetMeta">
                                <span class="cabinetAlgo">BFS · DFS</span>
                                <span class="cabinetGenre">PATHFINDING</span>
                            </div>
                            <button class="pressStartBtn" data-game="frozen_lake">PRESS&nbsp;START</button>
                        </div>
                    </article>

                    <!-- ── CABINET 8 REINAS ── -->
                    <article class="cabinet" data-game="ocho_reinas" data-theme="chess">
                        <div class="cabinetMarquee">
                            <span class="cabinetMarqueeLabel">MÓDULO 02</span>
                            <h2>8 QUEENS</h2>
                        </div>
                        <div class="cabinetScreen">
                            <div class="screenGrid screenGridChess" id="previewReinas"></div>
                            <div class="screenScanlines"></div>
                            <div class="screenVignette"></div>
                        </div>
                        <div class="cabinetControls">
                            <div class="cabinetMeta">
                                <span class="cabinetAlgo">HILL · SA</span>
                                <span class="cabinetGenre">CONSTRAINTS</span>
                            </div>
                            <button class="pressStartBtn" data-game="ocho_reinas">PRESS&nbsp;START</button>
                        </div>
                    </article>

                    <!-- ── CABINET SOKOBAN ── -->
                    <article class="cabinet" data-game="sokoban" data-theme="warehouse">
                        <div class="cabinetMarquee">
                            <span class="cabinetMarqueeLabel">MÓDULO 03</span>
                            <h2>SOKOBAN</h2>
                        </div>
                        <div class="cabinetScreen">
                            <div class="screenGrid screenGridSk" id="previewSokoban"></div>
                            <div class="screenScanlines"></div>
                            <div class="screenVignette"></div>
                        </div>
                        <div class="cabinetControls">
                            <div class="cabinetMeta">
                                <span class="cabinetAlgo">A* · GBFS</span>
                                <span class="cabinetGenre">PLANNING</span>
                            </div>
                            <button class="pressStartBtn" data-game="sokoban">PRESS&nbsp;START</button>
                        </div>
                    </article>
                    <!-- TIC TAC TOE -->
                    <article class="cabinet" data-game="tic_tac_toe" data-theme="tic">
                        <div class="cabinetMarquee">
                            <span class="cabinetMarqueeLabel">MÓDULO 04</span>
                            <h2>TIC TAC TOE</h2>
                        </div>
                        <div class="cabinetScreen">
                            <div id="previewTicTacToe" class="screenGridTic"></div>
                            <div class="screenScanlines"></div>
                            <div class="screenVignette"></div>
                        </div>
                        <div class="cabinetControls">
                            <div class="cabinetMeta">
                                <span class="cabinetAlgo">MINIMAX · αβ</span>
                                <span class="cabinetGenre">GAME TREE</span>
                            </div>
                            <button class="pressStartBtn"
                                    data-game="tic_tac_toe">
                                PRESS START
                            </button>
                        </div>
                    </article>
                </div>
            </div>
            <button class="carouselNav next" id="navNext" aria-label="siguiente">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 4 L17 12 L9 20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="square"/></svg>
            </button>
            <div class="carouselDots" id="carouselDots"></div>
        </div>
    </section>
    <section id="contenido" class="gameView"></section>
    <footer class="arcadeFooter">
        <span>© 2026 · PRÁCTICA 1 — GENERAL SEARCH ENGINE</span>
        <span class="footerStatus"><span class="statusDot"></span> SYSTEM ONLINE</span>
    </footer>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
